<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahatma Phule LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>Mahatma Phule LMS</h1>
    <p class="muted">Sign in to your account</p>

    <form id="login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
      <p class="note-msg" id="msg"></p>
    </form>
  </div>

  <p class="hint">
    Accounts are created by the institute office.<br>
    Ask the office if you do not have your login details.
  </p>
</div>

<script src="/app.js"></script>
<script>
if (localStorage.getItem('lms_token') && storedUser()) {
  location.href = homeFor(storedUser().role);
}

document.getElementById('login').onsubmit = async function (e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const data = await api('POST', '/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    localStorage.setItem('lms_token', data.token);
    localStorage.setItem('lms_user', JSON.stringify(data.user));
    location.href = homeFor(data.user.role);
  } catch (err) {
    msg.textContent = err.message;
  }
};
</script>
</body>
</html>
