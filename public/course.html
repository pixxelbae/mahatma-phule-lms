<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <a class="back" href="/dashboard">&larr; All courses</a>

  <div class="hero">
    <h1 id="title"></h1>
    <p class="muted" id="sub" style="margin:0"></p>
    <div id="hero-progress"></div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button data-tab="topics" role="tab">Topics</button>
    <button data-tab="attendance" role="tab">My attendance</button>
  </div>

  <div id="tab-topics"></div>

  <div id="tab-attendance" hidden>
    <div class="card" id="att-summary"></div>
    <div class="card" id="att-list"></div>
  </div>
</main>

<script src="/app.js"></script>
<script>
requireUser(['student']);
const courseId = param('id');

function noteItem(n) {
  return '<div class="item">' +
    '<span class="item-icon note">' + icon('note') + '</span>' +
    '<div class="item-main"><h3>' + esc(n.title) + '</h3>' +
      (n.content ? '<details><summary></summary><pre class="note-body">' + esc(n.content) + '</pre></details>' : '') +
    '</div>' +
    (n.fileName ? '<div class="item-actions"><a class="tag" href="/files/' + n.id + '">' + icon('download') + 'Download</a></div>' : '') +
  '</div>';
}

function quizItem(q) {
  const done = !!q.result;
  return '<div class="item">' +
    '<span class="item-icon ' + (done ? 'done' : 'quiz') + '">' + icon(done ? 'check' : 'quiz') + '</span>' +
    '<div class="item-main"><h3>' + esc(q.title) + '</h3>' +
      '<div class="muted">Quiz &middot; ' + plural(q.questionCount, 'question') + ' &middot; ' + plural(q.totalMarks, 'mark') + '</div></div>' +
    '<div class="item-actions">' + (done
      ? '<span class="tag plain">Scored ' + q.result.score + '/' + q.result.total + '</span><a class="tag" href="/quiz?id=' + q.id + '">Review</a>'
      : '<a class="tag" href="/quiz?id=' + q.id + '">Attempt quiz</a>') +
    '</div>' +
  '</div>';
}

function topicCard(num, title, notes, quizzes) {
  const done = quizzes.filter(q => q.result).length;
  const st = topicStatus(done, quizzes.length);
  const body = notes.map(noteItem).join('') + quizzes.map(quizItem).join('');
  return '<div class="card topic">' +
    '<div class="topic-head">' +
      '<h3>' + (num ? '<span class="topic-num">' + num + '</span>' : '') + esc(title) + '</h3>' +
      '<div class="topic-side">' +
        (quizzes.length ? progressBar(done, quizzes.length, 'sm') : '') +
        '<span class="pill ' + st.cls + '">' + st.text + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="topic-body">' + (body || '<p class="empty" style="padding:12px 0">Nothing added to this topic yet.</p>') + '</div>' +
  '</div>';
}

function renderTopics(data) {
  const byTopic = id => ({
    notes: data.notes.filter(n => n.topicId === id),
    quizzes: data.quizzes.filter(q => q.topicId === id)
  });
  let html = data.topics.map((t, i) => {
    const g = byTopic(t.id);
    return topicCard(i + 1, t.title, g.notes, g.quizzes);
  }).join('');
  const general = byTopic(null);
  if (general.notes.length || general.quizzes.length) {
    html += topicCard(null, data.topics.length ? 'General' : 'Notes and quizzes', general.notes, general.quizzes);
  }
  document.getElementById('tab-topics').innerHTML = html ||
    '<div class="card"><p class="empty">Your teacher has not added anything to this course yet.</p></div>';
}

function renderHero(data) {
  const p = data.progress;
  // Next topic = first one with quizzes still to attempt.
  const next = data.topics.find(t => data.quizzes.some(q => q.topicId === t.id && !q.result));
  document.getElementById('hero-progress').innerHTML = p.total
    ? progressBar(p.attempted, p.total) +
      '<div class="hero-meta">' +
        '<span><b>' + pct(p.attempted, p.total) + '%</b> complete &middot; ' + p.attempted + ' of ' + plural(p.total, 'quiz', 'quizzes') + ' attempted</span>' +
        '<span>' + (p.topicsTotal ? p.topicsDone + ' of ' + plural(p.topicsTotal, 'topic') + ' completed' : '') + '</span>' +
      '</div>' +
      (next ? '<div class="hero-meta"><span>Up next: <b>' + esc(next.title) + '</b></span></div>' : '')
    : '';
}

async function renderAttendance() {
  const { sessions } = await api('GET', '/courses/' + courseId + '/sessions');
  const present = sessions.filter(s => s.present).length;
  const p = pct(present, sessions.length);
  document.getElementById('att-summary').innerHTML = sessions.length
    ? '<div class="ring-row">' +
        '<div class="ring" style="--p:' + p + '"><span>' + p + '%</span></div>' +
        '<div><h3>Attendance</h3>' +
          '<p class="muted" style="margin:0">Present at ' + present + ' of ' + plural(sessions.length, 'session') + ' &middot; ' +
          plural(sessions.length - present, 'absence', 'absences') + '</p></div>' +
      '</div>'
    : '<p class="empty">No class sessions have been recorded yet.</p>';
  document.getElementById('att-list').style.display = sessions.length ? '' : 'none';
  document.getElementById('att-list').innerHTML = '<h2>Session history</h2>' + sessions.map(s => {
    const d = new Date(s.date + 'T12:00:00');
    return '<div class="session">' +
      '<div class="date-chip' + (s.present ? '' : ' absent') + '"><b>' + d.getDate() + '</b><small>' + d.toLocaleDateString('en-IN', { month: 'short' }) + '</small></div>' +
      '<div class="session-main">' +
        '<div class="row" style="align-items:flex-start"><h3>' + esc(s.topics.join(', ') || 'Class session') + '</h3>' +
          '<span class="pill ' + (s.present ? 'done' : 'absent') + '">' + (s.present ? 'Present' : 'Absent') + '</span></div>' +
        '<div class="muted">' + niceDate(s.date) + '</div>' +
        (s.summary ? '<p style="margin:6px 0 0;font-size:14px;color:#5d574e">' + esc(s.summary) + '</p>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

async function load() {
  const data = await api('GET', '/courses/' + courseId);
  document.title = data.course.title;
  document.getElementById('title').textContent = data.course.title;
  document.getElementById('sub').textContent =
    (data.course.description ? data.course.description + ' · ' : '') + 'Taught by ' + data.course.teacher;
  renderHero(data);
  renderTopics(data);
  await renderAttendance();
}

tabs(document.getElementById('tabs'));
load().catch(err => { document.querySelector('main').innerHTML = '<p class="note-msg">' + esc(err.message) + '</p>'; });
</script>
</body>
</html>
